name: Live metadata and embed probe
on:
  push:
    branches: [fix/tenrai-catalog-quicklinks-public-embed-20261029]
permissions:
  contents: read
jobs:
  external-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Tenrai and candidate embed HTTP response
        run: |
          node --input-type=module <<'JS'
          const urls=[
           'https://api.tenrai.org/v1/anime/1',
           'https://api.aniweeb.net/embed/mal/21/1?track=sub',
           'https://www.animeembed.com/embed/mal/21/1',
           'https://justplay.boo/embed/?mal=21&ep=1&lang=sub',
           'https://nikastream.blog/embed/mal/21/1/sub',
           'https://megavid.buzz/mal/21/1/sub',
           'https://anixo.buzz/embed/mal/21/1?track=sub',
           'https://api.yenime.net/'
          ]
          for(const url of urls){
           try{
            const r=await fetch(url,{signal:AbortSignal.timeout(12000),redirect:'manual',headers:{'Accept':'text/html,application/json'}})
            console.log('PROBE',r.status,r.headers.get('content-type')??'',r.headers.get('location')??'',url)
            if(r.ok&&url.includes('tenrai.org'))console.log('MAL', (await r.json())?.data?.mal_id)
           }catch(e){console.log('PROBE ERROR',e?.message,url)}
          }
          JS
