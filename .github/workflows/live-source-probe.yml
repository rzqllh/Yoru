name: Live metadata and embed probe
on:
  push:
    branches: [fix/tenrai-catalog-quicklinks-public-embed-20261029]
permissions:
  contents: read
jobs:
  external-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public anime metadata and source candidates
        run: |
          node --input-type=module <<'JS'
          const urls=[
           'https://api.tenrai.org/v1/anime/1',
           'https://api.tenrai.org/v1/seasons/now?page=1&limit=2',
           'https://api.tenrai.org/v1/top/anime?page=1&limit=2',
           'https://justplay.boo/embed/?mal=21&ep=1&lang=sub',
           'https://streamapi.web.id/p/anime/home?page=1',
           'https://streamapi.web.id/p/anime/search?q=naruto&page=1',
           'https://wajik-anime-api.vercel.app/otakudesu/ongoing?page=1'
          ]
          for(const url of urls){
           try{
            const r=await fetch(url,{signal:AbortSignal.timeout(12000),redirect:'manual',headers:{'Accept':'text/html,application/json'}})
            console.log('PROBE',r.status,r.headers.get('content-type')??'',url)
            if(r.ok&&r.headers.get('content-type')?.includes('json')){
              const data=await r.json()
              const keys=Object.keys(data??{}).slice(0,15)
              const summary=JSON.stringify(data).slice(0,480)
              console.log('DATA_KEYS',keys.join(','))
              console.log('DATA_PREVIEW',summary)
            }
           }catch(e){console.log('PROBE ERROR',e?.message,url)}
          }
          JS

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install headless Chromium for remote player probe
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.64.1
          npx playwright install --with-deps chromium
      - name: Start Yoru preview server
        run: |
          npm run build
          node scripts/start.mjs >/tmp/yoru-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8787/api/health >/dev/null && break || sleep 1; done
      - name: Inspect player as cross-origin iframe in a local Yoru page
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test'
          const browser=await chromium.launch()
          const checks=[['one-piece','https://www.animeembed.com/embed/mal/21/1']]
          for(const [name,url] of checks){
            const page=await browser.newPage()
            try{
              await page.goto('http://127.0.0.1:8787',{waitUntil:'domcontentloaded'})
              await page.setContent(`<html><body style="margin:0;background:#000"><iframe title="external" src="${url}" style="width:100%;height:720px;border:0" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe></body></html>`)
              const frame=page.frameLocator('iframe')
              await page.waitForTimeout(15000)
              const summary=await frame.locator('body').innerText({timeout:10000}).catch(e=>e.message.slice(0,120))
              const videos=await frame.locator('video').evaluateAll(vs=>vs.map(v=>({readyState:v.readyState,currentTime:v.currentTime,duration:v.duration,networkState:v.networkState,src:!!v.currentSrc}))).catch(()=>[])
              const video=frame.locator('video').first()
              const playResult=await video.evaluate(async v=>{v.muted=true;try{await v.play();return 'playing'}catch(e){return e.message}}).catch(e=>e.message)
              await page.waitForTimeout(2000)
              const elapsed=await video.evaluate(v=>v.currentTime).catch(()=>-1)
              console.log('IFRAME_PLAY_RESULT',name,playResult,'elapsed',elapsed)
              await page.mouse.click(640,350)
              await page.waitForTimeout(5500)
              const afterClick=await video.evaluate(v=>({paused:v.paused,time:v.currentTime,ready:v.readyState,buffered:v.buffered.length,error:v.error?.message??null})).catch(e=>({error:e.message}))
              console.log('IFRAME_AFTER_REAL_CLICK',name,JSON.stringify(afterClick))
              console.log('IFRAME_PLAYER',name,'body',summary.slice(0,350))
              console.log('IFRAME_VIDEO',name,JSON.stringify(videos))
              await page.screenshot({path:'remote-player-'+name+'.png',fullPage:true})
            }catch(e){console.log('IFRAME_ERROR',name,e.message.slice(0,300))}
            finally{await page.close()}
          }
          await browser.close()
          JS
        env:
          NODE_OPTIONS: --no-warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-player-visual-evidence
          path: remote-player-*.png
          if-no-files-found: ignore
