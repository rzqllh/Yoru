name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
concurrency:
  group: yoru-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Preserve dependency lockfile for reproducible builds
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Lint, typecheck, unit tests and production build
        run: npm run check
      - name: Check production dependencies for high-severity advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Smoke-test compiled HTTP server and local HLS fixture
        shell: bash
        run: |
          node scripts/start.mjs > /tmp/yoru-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/api/health > /tmp/yoru-health.json; then break; fi
            sleep 1
          done
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('/tmp/yoru-health.json','utf8'));if(h.status!=='ok')process.exit(1)"
          curl --fail --silent --show-error http://127.0.0.1:8787/ | grep -q '<div id="root"'
          curl --fail --silent --show-error -D /tmp/yoru-headers.txt -o /dev/null http://127.0.0.1:8787/api/health
          grep -Eiq '^x-content-type-options: nosniff' /tmp/yoru-headers.txt
          grep -Eiq '^x-frame-options: DENY' /tmp/yoru-headers.txt
          grep -Eiq '^cache-control: no-store' /tmp/yoru-headers.txt
          grep -Eiq '^content-security-policy: .*frame-ancestors' /tmp/yoru-headers.txt
          curl --fail --silent --show-error http://127.0.0.1:8787/demo/stream.m3u8 | grep -q 'segment-000.ts'
          grep -q 'yoru-shell-v3-' frontend/dist/sw.js
          grep -q '"/assets/' frontend/dist/sw.js
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/api/anime/search?q=')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/api/streams?episodeRef=bad')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/api/unknown')" = 404
          curl --fail --silent --show-error http://127.0.0.1:8787/api/providers | grep -q 'providers'
          node scripts/verify-providers.mjs
          node scripts/verify-jikan.mjs
      - name: Upload production build from validated commit
        uses: actions/upload-artifact@v4
        with:
          name: yoru-production
          path: |
            frontend/dist/
            backend/dist/
          if-no-files-found: error
          retention-days: 14
