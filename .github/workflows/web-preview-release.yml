name: Release download cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remove-non-installable-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Retire misleading web ZIP; keep source and honest preview notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=v0.9.0-rc.1
          asset=yoru-web-preview.zip
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Preview release does not exist, nothing to clean"
            exit 0
          fi
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release delete-asset "$tag" "$asset" --yes
            echo "Removed non-installable web archive"
          else
            echo "No misleading web archive remains"
          fi
          cat > release-notes.md <<'EOF'
          Yoru v0.9.0-rc.1 is a historical WEB PREVIEW source snapshot, not an installable application.

          **No standalone executable, APK, IPA or user-ready web ZIP is attached.**
          GitHub may show auto-generated Source code ZIP/TAR files. Those are source archives, not application installers.

          To run the current web app, follow the root README:
          https://github.com/rzqllh/Yoru#mulai-dalam-beberapa-menit

          Requirements: Node.js 22.12+, npm, git. Clone the repository, run
          npm ci, then npm run dev, and open http://127.0.0.1:5173.
          A production-style local PWA requires npm run build and npm start.

          Demo HLS+Indonesian VTT is bundled. Real anime playback requires manually configured HTTPS media or compatible Stremio addon. Native packages and real iOS testing are not yet available.
          EOF
          gh release edit "$tag" --notes-file release-notes.md --title "Yoru v0.9.0-rc.1 — Source preview (no installer)"
